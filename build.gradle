plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "ee-circuits-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

processResources {
    def props = [mod_version: mod_version]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    compileOnly files('../ee-work/electroenergetics-1.21.1-1.1.1.jar', '../ee-work/create-1.21.1-6.0.10.jar')
    jarJar(implementation("org.ejml:ejml-core:0.44.0"))
    jarJar(implementation("org.ejml:ejml-ddense:0.44.0"))
    jarJar(implementation("org.ejml:ejml-dsparse:0.44.0"))
    testImplementation("org.junit.jupiter:junit-jupiter:5.10.2")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

test {
    useJUnitPlatform()
    testLogging { showStandardStreams = true }
}

jar {
    from('LICENSE', 'NOTICE', 'LICENSE-APACHE-2.0')
}
